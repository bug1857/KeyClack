name: Build & Test KeyClack (macOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Swift XCTest Suite on macOS
        run: swift test --verbose

      - name: Build Universal KeyClack.app (Apple Silicon + Intel)
        run: |
          chmod +x build-app.sh
          ./build-app.sh --universal

      - name: Verify Universal Binary, Signature, and App Icon
        run: |
          set -euo pipefail
          lipo -info build/KeyClack.app/Contents/MacOS/KeyClack | grep -q "arm64"
          lipo -info build/KeyClack.app/Contents/MacOS/KeyClack | grep -q "x86_64"
          test -f build/KeyClack.app/Contents/Resources/AppIcon.icns
          codesign --verify --deep --strict build/KeyClack.app
          echo "✅ Verified Universal arm64 + x86_64 binary, AppIcon.icns, and code signature."

      - name: Package KeyClack-macOS.zip
        run: |
          cd build
          zip -r -y KeyClack-macOS.zip KeyClack.app

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyClack-macOS
          path: build/KeyClack-macOS.zip

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/KeyClack-macOS.zip \
            --title "KeyClack ${GITHUB_REF_NAME}" \
            --notes "Free, ultra-low-latency native macOS mechanical keyboard simulator (Universal Apple Silicon + Intel).

### Quick Install
1. Download **KeyClack-macOS.zip** below and unzip it.
2. Drag **KeyClack.app** into **/Applications**.
3. Run once in Terminal to clear macOS's download quarantine flag (ad-hoc signed, not notarized):
   \`\`\`bash
   xattr -cr /Applications/KeyClack.app && open /Applications/KeyClack.app
   \`\`\`
4. Click the keyboard icon in your menu bar → **Grant Permission in System Settings** → enable **KeyClack** under **Privacy & Security → Input Monitoring**."
